aid: qolab
name: Qolab
description: 'Qolab, Inc. is a superconducting quantum computing hardware company founded
  in 2022, with offices in Los Angeles, California and research laboratories in Madison,
  Wisconsin. Co-founded by 2025 Nobel laureate in physics John Martinis and Alan Ho —
  both of whom led hardware and product for Google''s 2019 quantum supremacy milestone —
  Qolab builds high-coherence superconducting qubits by applying advanced semiconductor
  manufacturing processes to qubit fabrication, targeting the yield and integration
  problems that stand between quantum research and utility-scale machines. Its first
  deployable offering is Qolab Start, a turn-key superconducting QPU platform for
  pulse-level and device-level hardware research, sold to university labs, national
  laboratories and semiconductor R&D teams and delivered either on-premise or through
  secure cloud connectivity. Qolab has raised roughly $70M across a $16M Series A and
  a $54.2M Series B led by UC Investments, with strategic investment from Applied
  Ventures and Western Digital, and leads hardware development for DARPA''s Quantum
  Benchmarking Initiative. Qolab publishes no public developer program: there is no
  developer portal, no machine-readable API contract and no self-serve sign-up, and the
  API and control interface guides that ship with Qolab Start are released to customers
  after a Request Access review.'
